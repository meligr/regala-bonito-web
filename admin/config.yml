backend:
  name: github
  repo: meligr/regala-bonito
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "productos"
    label: "Productos del Catálogo"
    files:
      - name: "lista_productos"
        label: "Lista de Productos"
        file: "data/products.json"
        fields:
          - label: "Productos"
            name: "productos"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Precio (CUP)", name: "price", widget: "number" }
              - { label: "Categoría ID", name: "category_id", widget: "string" }
              - { label: "Imagen", name: "image_url", widget: "image" }
